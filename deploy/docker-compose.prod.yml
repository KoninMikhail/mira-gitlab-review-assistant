# Production topology for Mira Review Bot — the "target" split from
# docs/05-operations/deployment.md §1.2:
#
#   postgres ─┐
#   redis ────┼─> api (healthz/webhook) + poller (discovery) + worker(s) (review)
#
# All `mira-*` services share ONE locally-built image (mira-review-bot:latest);
# the process role is chosen per-service via ROLE. Workers scale horizontally:
#   docker compose ... up -d --scale worker=N
#
# Secrets + host paths come from deploy/.env (generated by scripts/app/gen-secrets.sh).
# Postgres/Redis are NOT published to the host — reachable only on the internal
# compose network. Only the api health/webhook port is bound (to localhost by
# default; put a TLS reverse proxy in front for phase-2 webhooks).
name: mira

# ── Shared definition for every mira-* application service ───────────────────
x-mira-app: &mira-app
  image: mira-review-bot:latest
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    xray:
      condition: service_started
  volumes:
    - ${MIRA_BASE:-/opt/mira}/work:/work
    - ${MIRA_BASE:-/opt/mira}/cache/mirrors:/cache/mirrors
    - ${MIRA_BASE:-/opt/mira}/config/config.yml:/etc/mira/config.yml:ro
    - ${MIRA_BASE:-/opt/mira}/xray/proxychains.conf:/etc/mira/proxychains.conf:ro
  restart: unless-stopped

x-mira-env: &mira-env
  # Scale-out backends (override the single-process MVP defaults).
  MIRA_QUEUE: redis
  MIRA_STORE: postgres
  MIRA_CHECKOUT: mirror
  MIRA_CHECKOUT_CACHE_DIR: /cache/mirrors
  # Connection strings are derived from the generated passwords so they never
  # drift from the postgres/redis services. `:?` fails fast if .env is missing them.
  DATABASE_URL: "postgres://${POSTGRES_USER:-mira}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-mira}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}@redis:6379"
  MIRA_POLICY_CONFIG: /etc/mira/config.yml
  WORKSPACE_ROOT: /work
  HEALTH_PORT: "8080"
  MAX_CONCURRENCY: "${MAX_CONCURRENCY:-1}"
  POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-60000}"
  MIRA_PUBLISHER: "${MIRA_PUBLISHER:-log}"
  CURSOR_AGENT_BIN: /usr/local/bin/cursor-agent-via-proxy

services:
  # ── Data plane (internal only — no host port mappings) ─────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mira}
      # Enforce SCRAM password auth instead of trust/md5 for new init.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - ${MIRA_BASE:-/opt/mira}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mira} -d ${POSTGRES_DB:-mira}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Password-protected + AOF persistence. No port published to the host.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
    volumes:
      - ${MIRA_BASE:-/opt/mira}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SOCKS sidecar for cursor-agent only. Host file is a secret (see
  # deploy/xray/config.example.json); do not commit the live config.json.
  xray:
    image: teddysun/xray:latest
    volumes:
      - ${MIRA_BASE:-/opt/mira}/xray/config.json:/etc/xray/config.json:ro
    restart: unless-stopped
    expose:
      - "10808"

  # ── Application plane (one shared image, role per service) ─────────────────
  api:
    <<: *mira-app
    environment:
      <<: *mira-env
      ROLE: api
    # Bind to loopback by default; front with a TLS reverse proxy for webhooks.
    ports:
      - "${HEALTH_PUBLISH:-127.0.0.1:8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  poller:
    <<: *mira-app
    environment:
      <<: *mira-env
      ROLE: poller

  worker:
    <<: *mira-app
    environment:
      <<: *mira-env
      ROLE: worker
    # Scale horizontally: docker compose ... up -d --scale worker=N
