# MVP topology: one all-in-one container (api + poller + worker, SQLite,
# in-process queue). Split into api/worker services + Redis/Postgres later
# (docs/05-operations/deployment.md §1, §3).
services:
  mira:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mira-review-bot:latest
    environment:
      ROLE: all
      CURSOR_API_KEY: ${CURSOR_API_KEY}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      # Webhook shared secret (phase 2). Empty disables verification.
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET}
      KAITEN_BASE_URL: ${KAITEN_BASE_URL}
      KAITEN_TOKEN: ${KAITEN_TOKEN}
      # `log` (dry-run, default) until the bot has MR write access (🔑P2); then `gitlab`.
      MIRA_PUBLISHER: ${MIRA_PUBLISHER:-log}
      # Pilot projects + per-repo policy live in this YAML (docs/03-reference/policy-config.md §4).
      MIRA_POLICY_CONFIG: /etc/mira/config.yml
      MIRA_DB_PATH: /data/mira.db
      WORKSPACE_ROOT: /work
      MAX_CONCURRENCY: '1'
      POLL_INTERVAL_MS: '60000'
      HEALTH_PORT: '8080'
    ports:
      - '8080:8080'
    volumes:
      - mira-data:/data
      - mira-work:/work
      - ./config.yml:/etc/mira/config.yml:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mira-data:
  mira-work:
